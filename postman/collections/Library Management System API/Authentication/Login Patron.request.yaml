$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{patronEmail}}",
      "password": "{{patronPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Patron login succeeds', function () {
          pm.response.to.have.status(200);
      });
      const response = pm.response.json();
      if (response.access_token) {
          pm.collectionVariables.set('patronToken', response.access_token);
      }
    language: text/javascript
order: 2000
